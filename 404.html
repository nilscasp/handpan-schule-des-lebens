<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden – Handpan Schule des Lebens</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0A0E14">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/og-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-bg: #0A0E14;
            --color-bg-lighter: #141922;
            --color-text: #E8E6E3;
            --color-text-muted: #A0A0A0;
            --color-accent: #D4A574;
        }

        body {
            font-family: 'Spectral', Georgia, serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.85;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .logo-link {
            text-decoration: none;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            transition: opacity 0.3s ease;
        }
        .logo-link:hover { opacity: 0.8; }

        .logo-icon {
            width: 40px;
            height: 40px;
            opacity: 0.85;
        }

        .logo-text {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--color-text);
        }

        .error-code {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 300;
            color: var(--color-accent);
            opacity: 0.35;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 400;
            margin-bottom: 1rem;
            color: var(--color-text);
        }
        /* Feine Goldlinie unter der Überschrift */
        h1::after {
            content: '';
            display: block;
            width: 56px;
            height: 1px;
            margin: 1.5rem auto 0;
            background: var(--color-accent);
            opacity: 0.5;
        }

        p {
            color: var(--color-text-muted);
            font-size: 1rem;
            max-width: 440px;
            margin-bottom: 2.5rem;
        }

        /* Knopf: Goldrahmen statt Fläche (Gestaltung „Gravur“) */
        .home-link {
            display: inline-block;
            padding: 0.95rem 2.1rem;
            background: transparent;
            border: 1px solid rgba(212, 165, 116, 0.6);
            border-radius: 2px;
            color: #EAD7BE;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: border-color .4s ease, box-shadow .4s ease, color .4s ease;
        }
        .home-link:hover,
        .home-link:focus-visible {
            color: #F5E6D3;
            border-color: var(--color-accent);
            box-shadow: inset 0 0 28px rgba(212, 165, 116, 0.16), 0 0 24px rgba(212, 165, 116, 0.10);
        }

        /* Lang badge */
        .lang-badge {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.95rem;
            background: var(--color-bg);
            border: 1px solid rgba(212, 165, 116, 0.25);
            border-radius: 2px;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: border-color .4s ease, color .4s ease;
        }
        .lang-badge:hover {
            border-color: rgba(212, 165, 116, 0.6);
            color: var(--color-accent);
        }
        .lang-badge-icon {
            font-size: 0.95rem;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .lang-badge {
                bottom: 1rem;
                left: 1rem;
                padding: 0.45rem 0.85rem;
                font-size: 0.75rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/fonts/fonts.css?v=2026-07-05b">
</head>
<body>
    <a href="/" class="logo-link">
        <img src="/images/logo-mandala.svg" alt="Handpan Schule des Lebens Logo" class="logo-icon" decoding="async" width="40" height="40">
        <span class="logo-text">Handpan Schule des Lebens</span>
    </a>

    <div class="error-code">404</div>
    <h1>Diese Seite gibt es nicht</h1>
    <p>Vielleicht hat sich der Weg verändert – aber die Musik spielt weiter. Finde zurück zur Startseite.</p>
    <a href="/" class="home-link">Zur Startseite</a>

    <a href="/en/" class="lang-badge" title="Switch to English">
        <span class="lang-badge-icon">🌐</span> EN
    </a>
</body>
</html>
